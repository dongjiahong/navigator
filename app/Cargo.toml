[package]
name = "nsh-app-navigator"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
# The notification API (`Notifications`) is on nsh's main, after 0.4.0.
# Pin one commit so the app and the hosts the CLI generates build one core.
nsh-core = { git = "https://github.com/longbridge/nsh", rev = "36b91689c1e7c38379179a56381de7ddab16c6a5" }
nsh-base = { git = "https://github.com/longbridge/nsh", rev = "36b91689c1e7c38379179a56381de7ddab16c6a5" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The interface list, for the broadcast addresses the phone probes.
libc = "0.2"
# The board's file. Bundled: SQLite is compiled in rather than found on the
# host, because an Android app has no system one to link against.
rusqlite = { version = "0.41.1", features = ["bundled"] }
# The pairing code's proof. A phone proves it knows the Mac's six digits with an
# HMAC of a one-time challenge, and the comparison is constant-time; none of the
# three is worth writing by hand when the crates are this small and this old.
sha2 = "0.11.1"
hmac = "0.13.0"
subtle = "2.6.1"

# Deadline reminders. The Mac's scheduled reminders go through the system's own
# notification centre here: it owns the schedule, delivers while the app is
# closed, and plays the sound chosen in System Settings. nsh's `Notifications`
# only shows one now, so the phone's due-now notification lives in `reminders.ts`.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6.5", features = ["exception"] }
objc2-foundation = { version = "0.3.2", features = ["std", "NSString", "NSArray", "NSSet", "NSError", "NSBundle"] }
objc2-user-notifications = { version = "0.3.2", features = [
    "std",
    "block2",
    "UNUserNotificationCenter",
    "UNNotification",
    "UNNotificationAction",
    "UNNotificationCategory",
    "UNNotificationContent",
    "UNNotificationRequest",
    "UNNotificationResponse",
    "UNNotificationSettings",
    "UNNotificationSound",
    "UNNotificationTrigger",
] }
# The Dock's badge. The board is often behind another window, and the icon is
# the one part of it a glance still sees, so the count of work that wants
# attention now goes there too. Default features are off: this crate is one icon
# corner's worth of AppKit, not the whole framework.
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSApplication",
    "NSDockTile",
    # `NSApplication` itself is exported behind both features.
    "NSResponder",
] }
block2 = "0.6.2"
