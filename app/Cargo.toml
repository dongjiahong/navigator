[package]
name = "nsh-app-navigator"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
nsh-core = "0.4.0"
nsh-base = "0.4.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The interface list, for the broadcast addresses the phone probes.
libc = "0.2"
# The board's file. Bundled: SQLite is compiled in rather than found on the
# host, because an Android app has no system one to link against.
rusqlite = { version = "0.41.1", features = ["bundled"] }

# Deadline reminders. nsh has no notification API, so the Mac's go through the
# system's own notification centre here: it owns the schedule, delivers while
# the app is closed, and plays the sound chosen in System Settings.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6.5", features = ["exception"] }
objc2-foundation = { version = "0.3.2", features = ["std", "NSString", "NSArray", "NSError", "NSBundle"] }
objc2-user-notifications = { version = "0.3.2", features = [
    "std",
    "block2",
    "UNUserNotificationCenter",
    "UNNotificationContent",
    "UNNotificationRequest",
    "UNNotificationSettings",
    "UNNotificationSound",
    "UNNotificationTrigger",
] }
block2 = "0.6.2"
