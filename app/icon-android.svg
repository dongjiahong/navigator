<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- The same rounded icon for Android, on the launcher's plate: the body is
       960 of the 1024 canvas, so the shape is the icon's own and the launcher
       only draws a thin rim around it, the way it does for neighbouring apps.
       Pass it by hand when packaging (see README, App icon). -->
